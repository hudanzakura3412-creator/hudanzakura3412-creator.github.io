<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIRA Music — Links</title>
<meta name="description" content="MIRA Music — AI Music Creator. YouTube / X / TikTok / Web">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #081428;
    --ink: #f0f6ff;
    --ink-dim: #a3b8dc;
    --accent: #6fb1ff;
    --accent-soft: rgba(111, 177, 255, 0.18);
    --line: rgba(150, 185, 240, 0.22);
    --card: rgba(24, 42, 78, 0.6);
    --bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    display: flex;
    min-height: 100vh;
    padding: 48px 20px;
    position: relative;
  }

  /* ===== 背景の光 ===== */
  .glow {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    pointer-events: none;
    z-index: 0;
  }
  .glow-1 {
    width: 560px; height: 560px;
    background: radial-gradient(circle, rgba(64, 128, 235, 0.4), transparent 70%);
    top: -180px; left: 50%;
    transform: translateX(-50%);
    animation: drift1 14s ease-in-out infinite alternate;
  }
  .glow-2 {
    width: 420px; height: 420px;
    background: radial-gradient(circle, rgba(45, 150, 235, 0.22), transparent 70%);
    bottom: -140px; right: -100px;
    animation: drift2 18s ease-in-out infinite alternate;
  }
  .glow-3 {
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(130, 100, 235, 0.15), transparent 70%);
    bottom: 10%; left: -80px;
    animation: drift1 20s ease-in-out infinite alternate-reverse;
  }
  @keyframes drift1 {
    from { transform: translateX(-50%) translateY(0); }
    to   { transform: translateX(-46%) translateY(30px); }
  }
  @keyframes drift2 {
    from { transform: translate(0, 0); }
    to   { transform: translate(-40px, -30px); }
  }

  /* ===== 星屑 ===== */
  .stars {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 0;
    background-image:
      radial-gradient(1px 1px at 12% 22%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 78% 14%, rgba(255,255,255,0.35), transparent),
      radial-gradient(1.5px 1.5px at 60% 68%, rgba(180,210,255,0.4), transparent),
      radial-gradient(1px 1px at 30% 82%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 88% 55%, rgba(180,210,255,0.35), transparent),
      radial-gradient(1.5px 1.5px at 45% 38%, rgba(255,255,255,0.25), transparent);
  }

  /* ===== メイン ===== */
  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
    margin: auto;
    text-align: center;
    animation: fadeUp 1s ease both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* アバター（ちびキャラ） */
  .avatar {
    width: 116px; height: 116px;
    margin: 0 auto 26px;
    border-radius: 50%;
    position: relative;
    overflow: hidden;
    background:
      linear-gradient(var(--bg), var(--bg)) padding-box,
      linear-gradient(135deg, rgba(120,170,255,0.9), rgba(40,70,140,0.25) 45%, rgba(120,170,255,0.7)) border-box;
    border: 2px solid transparent;
    box-shadow:
      0 0 44px rgba(90, 150, 245, 0.4),
      inset 0 0 30px rgba(90, 150, 245, 0.1);
    animation: floaty 4.5s ease-in-out infinite;
  }
  .avatar:hover { animation: puru 0.7s var(--bounce); }
  @keyframes floaty {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-5px); }
  }
  @keyframes puru {
    0%   { transform: scale(1, 1); }
    25%  { transform: scale(1.08, 0.92); }
    50%  { transform: scale(0.94, 1.06); }
    75%  { transform: scale(1.04, 0.97); }
    100% { transform: scale(1, 1); }
  }
  .avatar img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: 50% 56%;
    transform: scale(1.6);
    transform-origin: 50% 53%;
  }
  .avatar-ring {
    width: 144px; height: 144px;
    margin: 0 auto;
    position: relative;
  }
  .avatar-ring::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid rgba(120, 170, 255, 0.14);
    pointer-events: none;
  }
  .avatar-ring .avatar { margin-top: 14px; }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 40px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-indent: 0.22em;
    background: linear-gradient(170deg, #ffffff 30%, #a9c8ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .tagline {
    margin-top: 10px;
    font-size: 12.5px;
    font-weight: 300;
    letter-spacing: 0.32em;
    text-indent: 0.32em;
    color: var(--ink-dim);
    text-transform: uppercase;
  }

  .divider {
    width: 56px;
    height: 1px;
    margin: 30px auto;
    background: linear-gradient(90deg, transparent, rgba(140, 180, 255, 0.6), transparent);
  }

  /* ===== Latest MV フィーチャーカード ===== */
  .featured {
    display: block;
    position: relative;
    border-radius: 18px;
    overflow: hidden;
    margin-bottom: 22px;
    border: 1px solid var(--line);
    box-shadow: 0 10px 40px rgba(15, 40, 90, 0.5);
    transition: transform 0.5s var(--bounce),
                border-color 0.4s ease,
                box-shadow 0.4s ease;
  }
  .featured:hover {
    transform: translateY(-4px) scale(1.015);
    border-color: rgba(150, 190, 255, 0.55);
    box-shadow: 0 16px 52px rgba(55, 115, 220, 0.4);
  }
  .featured:active {
    transform: scale(0.98);
    transition-duration: 0.1s;
  }
  .featured img {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 10;
    object-fit: cover;
    object-position: 50% 47%;
    transition: transform 0.8s ease;
  }
  .featured:hover img { transform: scale(1.04); }
  .featured::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg,
      rgba(4, 7, 15, 0.15) 0%,
      transparent 30%,
      transparent 55%,
      rgba(4, 7, 15, 0.9) 100%);
    pointer-events: none;
  }
  .featured-label {
    position: absolute;
    top: 14px; left: 14px;
    z-index: 2;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.24em;
    text-indent: 0.24em;
    color: #dce9ff;
    background: rgba(8, 16, 34, 0.55);
    border: 1px solid rgba(140, 180, 255, 0.3);
    border-radius: 999px;
    padding: 6px 14px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .featured-info {
    position: absolute;
    left: 20px; right: 20px; bottom: 16px;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    text-align: left;
  }
  .featured-title {
    font-size: 19px;
    font-weight: 500;
    letter-spacing: 0.1em;
    color: #f2f7ff;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
  }
  .featured-sub {
    margin-top: 3px;
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.18em;
    color: rgba(210, 226, 255, 0.75);
    text-transform: uppercase;
  }
  .play-btn {
    flex-shrink: 0;
    width: 46px; height: 46px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(91, 157, 255, 0.2);
    border: 1px solid rgba(160, 195, 255, 0.5);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: background 0.35s ease, transform 0.5s var(--bounce);
  }
  .featured:hover .play-btn {
    background: rgba(111, 177, 255, 0.5);
    transform: scale(1.15);
  }
  .play-btn svg {
    width: 16px; height: 16px;
    fill: #eaf3ff;
    margin-left: 2px;
  }

  /* ===== リンクカード ===== */
  .links {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .link-card {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 17px 22px;
    border-radius: 14px;
    background: var(--card);
    border: 1px solid var(--line);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    text-decoration: none;
    color: var(--ink);
    position: relative;
    overflow: hidden;
    transition: transform 0.45s var(--bounce),
                border-color 0.35s ease,
                box-shadow 0.35s ease;
  }
  .link-card:active {
    transform: scale(0.96);
    transition-duration: 0.1s;
  }
  .link-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(105deg, transparent 40%, rgba(140, 180, 255, 0.07) 50%, transparent 60%);
    transform: translateX(-100%);
    transition: transform 0.7s ease;
  }
  .link-card:hover {
    transform: translateY(-4px) scale(1.02);
    border-color: rgba(150, 190, 255, 0.55);
    box-shadow: 0 10px 36px rgba(55, 115, 220, 0.3);
  }
  .link-card:hover::before { transform: translateX(100%); }

  .icon {
    width: 42px; height: 42px;
    flex-shrink: 0;
    border-radius: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--accent-soft);
    border: 1px solid rgba(130, 180, 255, 0.25);
    transition: background 0.35s ease, transform 0.45s var(--bounce);
  }
  .link-card:hover .icon {
    background: rgba(111, 177, 255, 0.32);
    transform: scale(1.12) rotate(-4deg);
  }
  .icon svg { width: 19px; height: 19px; fill: #b8d4ff; }

  .link-text { text-align: left; flex: 1; }
  .link-title {
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.06em;
  }
  .link-sub {
    margin-top: 2px;
    font-size: 11.5px;
    font-weight: 300;
    letter-spacing: 0.08em;
    color: var(--ink-dim);
  }

  .arrow {
    color: rgba(140, 180, 255, 0.4);
    font-size: 16px;
    transition: transform 0.35s ease, color 0.35s ease;
  }
  .link-card:hover .arrow {
    transform: translateX(4px);
    color: #a9c8ff;
  }

  footer {
    margin-top: 44px;
    font-size: 10.5px;
    letter-spacing: 0.28em;
    text-indent: 0.28em;
    color: rgba(143, 163, 196, 0.55);
    text-transform: uppercase;
  }

  @media (max-width: 400px) {
    h1 { font-size: 33px; }
    .monogram { width: 92px; height: 92px; }
    .monogram span { font-size: 44px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .glow-1, .glow-2, .glow-3, .container, .avatar { animation: none; }
  }
</style>
</head>
